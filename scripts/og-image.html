  <script>
    // Same fit as Header.jsx: track the tagline so it sits flush with the wordmark.
    function textWidth(el) { var r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; }
    function fit() {
      var word = document.querySelector(".word"), tag = document.querySelector(".tag");
      tag.style.letterSpacing = "normal"; tag.style.marginRight = "0px";
      var wordLS = parseFloat(getComputedStyle(word).letterSpacing) || 0;
      var target = textWidth(word) - wordLS, base = textWidth(tag), n = tag.textContent.trim().length;
      var ls = (target - base) / (n - 1);
      tag.style.letterSpacing = ls.toFixed(3) + "px"; tag.style.marginRight = (-ls).toFixed(3) + "px";
    }
    document.fonts.ready.then(fit);
  </script>
